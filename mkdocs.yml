site_name: AICodePrep Docs
site_description: Bundle selected code files into one context block for AI chats
site_url: https://aicp.wuu73.org
repo_url: https://github.com/detroittommy879/aicodeprep-gui
repo_name: detroittommy879/aicodeprep-gui
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  favicon: assets/favicon.ico
  icon:
    logo: material/code-braces-box
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use system theme

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Start Here:
      - What It Does: what-it-does.md
      - Install And Launch: install-and-launch.md
      - Right-Click Integration: right-click-integration.md
      - Core Workflow: core-workflow.md
      - Performance: performance.md
      - Keyboard Shortcuts: keyboard-shortcuts.md
  - Better Results:
      - Prompt Strategy: prompt-strategy.md
      - Why Use This Instead Of Agents: why-not-just-agents.md
  - Optional Pro:
      - Pro Features: pro-features.md
  - Reference:
      - FAQ: faq.md
